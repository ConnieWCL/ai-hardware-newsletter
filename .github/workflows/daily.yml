name: daily-digest

permissions:
  contents: write       # 用于把日报存档 push 回仓库

# 触发架构（2026-09-05 起生效）：
#
# 目标：每天上午 10:00-13:00（北京时间）之间送达日报。
# GitHub 的定时调度存在不可控队列延迟（实测 4.4-5.4 小时），单一 cron 无法保证准点。
# 因此把 cron 改为"多时段轮询 + 北京时间窗口守卫"：
#   - 每 30 分钟从 UTC 20:00 到次日 UTC 02:00 发起一次运行
#   - 每个运行先检查当前北京时间是否在 10:00-13:00 之间
#   - 第一个命中窗口的运行才会真正执行 pipeline，其余运行快速跳过
#   - pipeline 内部的幂等守卫（当日存档已存在则跳过）保证不会重复发信
#
# repository_dispatch 与 workflow_dispatch 仍然无条件执行，保留：
#   - 方案 A 在 Mac 在线时的即时触发能力
#   - 手动调试/补发的能力
#   - 未来接入外部定时服务（如 cron-job.org）的能力
#
on:
  repository_dispatch:
    types: [daily-digest]
  schedule:
    # UTC 20:00 - 02:00，每 30 分钟一轮；覆盖 GitHub 常见 4-5h 队列延迟
    - cron: "0 20 * * *"
    - cron: "30 20 * * *"
    - cron: "0 21 * * *"
    - cron: "30 21 * * *"
    - cron: "0 22 * * *"
    - cron: "30 22 * * *"
    - cron: "0 23 * * *"
    - cron: "30 23 * * *"
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
    - cron: "0 1 * * *"
    - cron: "30 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:        # 支持手动触发，便于调试

# 多轮询 + dispatch 可能在临界时间重叠，同组新运行会取消旧运行
concurrency:
  group: daily-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Check Beijing delivery window
        id: window
        run: |
          HOUR=$(TZ=Asia/Shanghai date +%H)
          MIN=$(TZ=Asia/Shanghai date +%M)
          TIME=$((10#$HOUR * 60 + 10#$MIN))
          if [[ "${{ github.event_name }}" == "schedule" && ($TIME -lt 600 || $TIME -gt 780) ]]; then
            echo "当前北京时间 ${HOUR}:${MIN}，不在 10:00-13:00 投递窗口内，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "当前北京时间 ${HOUR}:${MIN}，执行本次运行。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.window.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run pipeline
        if: steps.window.outputs.skip != 'true'
        run: python main.py
        env:
          # LLM：默认 Groq 免费层（见 config/config.yaml）。
          # 换提供商时无需改代码：在 Settings → Secrets and variables → Actions
          # → Variables 里加 LLM_BASE_URL / LLM_MODEL 即可整体切换。
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_HOST: smtp.163.com
          SMTP_PORT: "465"

      # 存档随仓库提交，周报汇总与信源健康度分析都从这里取数
      - name: Commit archive
        if: steps.window.outputs.skip != 'true'
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git add data/archive/ || true
          git commit -m "digest: $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push failed, archive saved in workflow run"

      # ── 公开存档站：从存档生成静态站点，发布到 gh-pages 分支 ──
      # 站点与邮件共用同一套渲染模板，不引入第二套前端，零构建工具
      - name: 生成公开存档站
        if: steps.window.outputs.skip != 'true'
        run: python scripts/build_site.py

      - name: 部署到 gh-pages 分支
        if: steps.window.outputs.skip != 'true'
        run: |
          mv site /tmp/site
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git checkout --orphan gh-pages
          git rm -rf . || true
          rm -rf .github src config tests scripts main.py requirements.txt .env.example data out 2>/dev/null || true
          cp -r /tmp/site/. .
          touch .nojekyll
          git add -A
          git commit -m "site: $(date -u +%F)" || echo "nothing to commit"
          git push -f origin gh-pages
