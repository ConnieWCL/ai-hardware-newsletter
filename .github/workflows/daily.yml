name: daily-digest

permissions:
  contents: write       # 用于把日报存档 push 回仓库

# 触发架构（2026-09-05 二次修订：窗口内轮询加密）：
#
# 目标：邮件每天稳定在北京时间 10:05-10:45 送达，异常时上午内兜底。
#
# 三次实测教训：
#   1. 单一 cron 的队列延迟不可控（4.4-5.4h 到几分钟不等）
#   2. cron 排在整点/半点（:00/:30）会被 GitHub 高负载队列丢弃
#      （09-05 UTC 02:00 班次被整体丢弃，导致全天无邮件）
#   3. 窗口内每 30 分钟一班太稀疏：首班被丢/被延迟，送达时间漂 1h+
#
# 因此：
#   - 窗口内（UTC 02:05-05:35，北京 10:05-13:35）加密到每 10 分钟一班，
#     正常情况（队列延迟几分钟）首班 10:05 执行，邮件 10:10-10:20 送达；
#     首班被丢则 10:15/10:25 兜底，送达时间聚拢在 10:05-10:45
#   - 窗口外保留每小时一班保险班（对抗极端队列延迟漂移）
#   - UTC 05:55（北京 13:55）为最后兜底班：绕过窗口判断强制执行，
#     pipeline 幂等守卫（当日存档已存在则跳过）保证不重复发信，
#     极端情况下邮件最晚下午 14 点左右送达，不缺席
#   - 每班第一步就做窗口判断（先于 checkout），窗口外跳过仅耗 ~5s
#
# concurrency 用排队而非取消：加密轮询下班间隔 10 分钟 < pipeline 耗时，
# cancel-in-progress 会误杀正在发信/提交存档的上一班
#
# repository_dispatch 与 workflow_dispatch 仍然无条件执行，保留：
#   - 方案 A 在 Mac 在线时的即时触发能力
#   - 手动调试/补发的能力
#   - 未来接入外部定时服务（如 cron-job.org）的能力
#
on:
  repository_dispatch:
    types: [daily-digest]
  schedule:
    # ── 窗口外保险班：每小时一班（北京 04:05-09:05）──
    - cron: "5 20 * * *"
    - cron: "5 21 * * *"
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"
    - cron: "5 0 * * *"
    - cron: "5 1 * * *"
    # ── 窗口内主力班：每 10 分钟一班（北京 10:05-13:35）──
    - cron: "5 2 * * *"
    - cron: "15 2 * * *"
    - cron: "25 2 * * *"
    - cron: "35 2 * * *"
    - cron: "45 2 * * *"
    - cron: "55 2 * * *"
    - cron: "5 3 * * *"
    - cron: "15 3 * * *"
    - cron: "25 3 * * *"
    - cron: "35 3 * * *"
    - cron: "45 3 * * *"
    - cron: "55 3 * * *"
    - cron: "5 4 * * *"
    - cron: "15 4 * * *"
    - cron: "25 4 * * *"
    - cron: "35 4 * * *"
    - cron: "45 4 * * *"
    - cron: "55 4 * * *"
    - cron: "5 5 * * *"
    - cron: "15 5 * * *"
    - cron: "25 5 * * *"
    - cron: "35 5 * * *"
    # ── 最后兜底班（北京 13:55）：绕过窗口判断，当日无存档则强制执行 ──
    - cron: "55 5 * * *"
  workflow_dispatch:        # 支持手动触发，便于调试

# 加密轮询下班间隔(10min)可能小于 pipeline 耗时，排队而非取消，
# 后续班次会命中 pipeline 幂等守卫直接跳过
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 窗口判断放最前（先于 checkout）：窗口外跳过仅耗 ~5s，减少排队积压
      - name: Check Beijing delivery window
        id: window
        run: |
          HOUR=$(TZ=Asia/Shanghai date +%H)
          MIN=$(TZ=Asia/Shanghai date +%M)
          TIME=$((10#$HOUR * 60 + 10#$MIN))
          EVENT="${{ github.event_name }}"
          SCHED="${{ github.event.schedule }}"
          # 最后兜底班（UTC 05:55）无条件放行，由 pipeline 幂等守卫决定是否真跑
          if [[ "$EVENT" == "schedule" && "$SCHED" != "55 5 * * *" && ($TIME -lt 600 || $TIME -gt 810) ]]; then
            echo "当前北京时间 ${HOUR}:${MIN}，不在 10:00-13:30 投递窗口内，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "当前北京时间 ${HOUR}:${MIN}，执行本次运行。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.window.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.window.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.window.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run pipeline
        if: steps.window.outputs.skip != 'true'
        run: python main.py
        env:
          # LLM：默认 Groq 免费层（见 config/config.yaml）。
          # 换提供商时无需改代码：在 Settings → Secrets and variables → Actions
          # → Variables 里加 LLM_BASE_URL / LLM_MODEL 即可整体切换。
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_HOST: smtp.163.com
          SMTP_PORT: "465"

      # 存档随仓库提交，周报汇总与信源健康度分析都从这里取数
      - name: Commit archive
        if: steps.window.outputs.skip != 'true'
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git add data/archive/ || true
          git commit -m "digest: $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push failed, archive saved in workflow run"

      # ── 公开存档站：从存档生成静态站点，发布到 gh-pages 分支 ──
      # 站点与邮件共用同一套渲染模板，不引入第二套前端，零构建工具
      - name: 生成公开存档站
        if: steps.window.outputs.skip != 'true'
        run: python scripts/build_site.py

      - name: 部署到 gh-pages 分支
        if: steps.window.outputs.skip != 'true'
        run: |
          mv site /tmp/site
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git checkout --orphan gh-pages
          git rm -rf . || true
          rm -rf .github src config tests scripts main.py requirements.txt .env.example data out 2>/dev/null || true
          cp -r /tmp/site/. .
          touch .nojekyll
          git add -A
          git commit -m "site: $(date -u +%F)" || echo "nothing to commit"
          git push -f origin gh-pages
