name: daily-digest

permissions:
  contents: write       # 用于把日报存档 push 回仓库

# 触发架构（2026-09-04 起生效）：
# 主通道 = repository_dispatch：方案 A（WorkBuddy automation，10:00）发完邮件后
#   调 GitHub API 触发本 workflow，方案 B 邮件 ~10:15 送达。
#   背景实测：GitHub 定时任务在 UTC 00:30（美西 16:30 高峰）排队延迟 4.5 小时，
#   cron 08:30 排期、12:50 才触发，外部触发是唯一能保证准点的手段。
# 兜底 = cron UTC 03:33（北京 11:33）：若方案 A 当天没跑（如本机离线），
#   由它补发；pipeline 里有幂等守卫（当日存档已存在则跳过），双触发不重复发信。
on:
  repository_dispatch:
    types: [daily-digest]
  schedule:
    - cron: "33 3 * * *"   # UTC 03:33 = 北京 11:33，仅兜底
  workflow_dispatch:        # 支持手动触发，便于调试

# 双触发（dispatch 主 + cron 兜底）可能在临界时间重叠，同组新运行会取消旧运行
concurrency:
  group: daily-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          # LLM：默认 Groq 免费层（见 config/config.yaml）。
          # 换提供商时无需改代码：在 Settings → Secrets and variables → Actions
          # → Variables 里加 LLM_BASE_URL / LLM_MODEL 即可整体切换。
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_HOST: smtp.163.com
          SMTP_PORT: "465"

      # 存档随仓库提交，周报汇总与信源健康度分析都从这里取数
      # 方案 A 可能通过 API 同时推送 data/plan_a/，需 rebase 避免冲突
      - run: |
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git add data/archive/ data/plan_a/ || true
          git commit -m "digest: $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push failed, archive saved in workflow run"

      # ── 公开存档站：从存档生成静态站点，发布到 gh-pages 分支 ──
      # 站点与邮件共用同一套渲染模板，不引入第二套前端，零构建工具
      - name: 生成公开存档站
        run: python scripts/build_site.py

      - name: 部署到 gh-pages 分支
        run: |
          mv site /tmp/site
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git checkout --orphan gh-pages
          git rm -rf . || true
          rm -rf .github src config tests scripts main.py requirements.txt .env.example data out 2>/dev/null || true
          cp -r /tmp/site/. .
          touch .nojekyll
          git add -A
          git commit -m "site: $(date -u +%F)" || echo "nothing to commit"
          git push -f origin gh-pages
